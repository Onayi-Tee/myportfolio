  <rect x="474" y="195" width="210" height="12" rx="6" fill="#aebed2" opacity="0.7"/>
  <rect x="474" y="220" width="160" height="12" rx="6" fill="#aebed2" opacity="0.7"/>
  <rect x="110" y="298" width="658" height="214" rx="18" fill="#112334"/>
  <text x="138" y="344" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#edf6ff">Clinical interpretation</text>
  <rect x="138" y="370" width="540" height="16" rx="8" fill="#60a5fa" opacity="0.72"/>
  <rect x="138" y="404" width="420" height="14" rx="7" fill="#aebed2" opacity="0.7"/>
  <rect x="138" y="435" width="470" height="14" rx="7" fill="#aebed2" opacity="0.7"/>
