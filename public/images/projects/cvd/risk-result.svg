<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Cardiovascular risk results illustration</title>
  <desc id="desc">Illustrative result card for a cardiovascular risk prediction output.</desc>
  <rect width="900" height="620" fill="#081927"/>
  <rect x="70" y="60" width="760" height="500" rx="24" fill="#0f1d2b" stroke="#2b3a4a"/>
  <rect x="110" y="100" width="280" height="160" rx="16" fill="#13293d"/>
  <circle cx="188" cy="168" r="52" fill="none" stroke="#5eead4" stroke-width="16"/>
  <circle cx="188" cy="168" r="52" fill="none" stroke="#081927" stroke-width="16" stroke-dasharray="180 220" transform="rotate(-90 188 168)"/>
  <text x="162" y="178" font-size="42" font-family="Segoe UI, Arial, sans-serif" fill="#edf6ff">42%</text>
